name: Fork release APK

# Builds a SIGNED release APK (fdroid flavor) using your own keystore.
# Manual only: Actions tab > Fork release APK > Run workflow.
#
# Needs four repository secrets (Settings > Secrets and variables > Actions):
#   KEYSTORE_BASE64    the keystore file, base64 encoded
#   KEYSTORE_PASSWORD  store password
#   KEY_ALIAS          key alias
#   KEY_PASSWORD       key password (the same value as KEYSTORE_PASSWORD for a PKCS12 keystore)
on:
  workflow_dispatch:

concurrency:
  group: fork-release-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build fdroid release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check and write signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=0
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::Missing GitHub secret $v"
              missing=1
            fi
          done
          [ "$missing" = "0" ] || exit 1
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          test -s "$RUNNER_TEMP/release.keystore" || { echo "::error::KEYSTORE_BASE64 decoded to an empty file"; exit 1; }
          # app/build.gradle reads signing.properties relative to the working directory,
          # so write it in the repo root and in app/ to be safe. Both are git-ignored.
          {
            echo "STORE_FILE=$RUNNER_TEMP/release.keystore"
            echo "STORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } > signing.properties
          cp signing.properties app/signing.properties
          echo "Signing config written."
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 17
      - name: Install NDK 28.2.13676358 (clean)
        run: |
          set -e
          NDK_DIR="$ANDROID_HOME/ndk/28.2.13676358"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          rm -rf "$NDK_DIR"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "ndk;28.2.13676358"
          test -e "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Cache Rust dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            file_operations/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Setup Rust for Android
        run: |
          cd file_operations
          chmod +x setup_rust_android.sh
          ./setup_rust_android.sh
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build fdroid release APK
        run: |
          set -o pipefail
          ./gradlew assembleFdroidRelease --stacktrace 2>&1 | tee build.log
      - name: Verify the APK signature
        run: |
          APK=$(ls app/build/outputs/apk/fdroid/release/*.apk | head -1)
          echo "APK: $APK"
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs "$APK" | grep -E "Verifies|Number of signers|certificate (DN|SHA-256)|v[0-9]" 
          case "$APK" in *unsigned*) echo "::error::APK is unsigned"; exit 1;; esac
      - name: Show build errors
        # Runs last on failure so the output is at the end of the job log.
        if: failure()
        run: |
          set +e
          echo "=== BUILD DIAGNOSTICS START ==="
          grep -E '^e: ' build.log | head -60 | cut -c1-400
          grep -E -B2 -A12 'error(\[|:)' build.log | grep -v -E '^[[:space:]]*at ' | head -80 | cut -c1-400
          grep -E -A8 'What went wrong' build.log | head -24 | cut -c1-300
          grep -E -i 'R8|missing class|Missing classes' build.log | head -20 | cut -c1-300
          echo "=== BUILD DIAGNOSTICS END ==="
          exit 0
      - name: Remove signing material
        if: always()
        run: |
          rm -f signing.properties app/signing.properties "$RUNNER_TEMP/release.keystore"
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: Amaze-fork-fdroid-release
          path: app/build/outputs/apk/fdroid/release/*.apk
          if-no-files-found: error
          retention-days: 14
