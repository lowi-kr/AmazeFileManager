name: Fork debug APK

# Builds the fdroid debug APK and attaches it to the run, so it can be
# downloaded and installed without a local Android toolchain.
# Runs on every push to a feature/** branch, or manually from the Actions tab.
on:
  push:
    branches:
      - 'feature/**'
  workflow_dispatch:

concurrency:
  group: fork-debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build fdroid debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 17
      - name: Set up NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          link-to-sdk: true
          local-cache: true
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Cache Rust dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            file_operations/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Setup Rust for Android
        run: |
          cd file_operations
          chmod +x setup_rust_android.sh
          ./setup_rust_android.sh
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build fdroid debug APK
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -o pipefail
          ./gradlew assembleFdroidDebug --stacktrace 2>&1 | tee build.log
      - name: Show Rust build error
        # Diagnosis only, runs last so the output sits at the end of the job log.
        if: failure()
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set +e
          ./gradlew :file_operations:cargoBuildArm --info --console=plain > rust.log 2>&1
          echo "=== RUST DIAGNOSTICS START ==="
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          rustc --version
          awk '/Starting process .command .cargo/{f=1} f{print} /finished with non-zero exit/{exit}' rust.log | cut -c1-400 | head -150
          echo "=== RUST DIAGNOSTICS END ==="
          exit 0
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: Amaze-fork-fdroid-debug
          path: app/build/outputs/apk/fdroid/debug/app-fdroid-debug.apk
          if-no-files-found: error
          retention-days: 14
