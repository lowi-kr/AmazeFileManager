name: Fork debug APK

# Builds the fdroid debug APK and attaches it to the run, so it can be
# downloaded and installed without a local Android toolchain.
# Runs on every push to a feature/** branch, or manually from the Actions tab.
on:
  push:
    branches:
      - 'feature/**'
  workflow_dispatch:

concurrency:
  group: fork-debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build fdroid debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 17
      - name: Install NDK 28.2.13676358 (clean)
        # The Gradle build is pinned to this exact NDK (gradle/libs.versions.toml).
        # The copy that was linked in earlier had no bin/clang, so reinstall it
        # with the SDK manager and fail early if clang is still missing.
        run: |
          set -e
          NDK_DIR="$ANDROID_HOME/ndk/28.2.13676358"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          rm -rf "$NDK_DIR"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "ndk;28.2.13676358"
          BIN="$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin"
          ls -la "$BIN" | grep -E ' clang' || true
          test -e "$BIN/clang"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Cache Rust dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            file_operations/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Setup Rust for Android
        run: |
          cd file_operations
          chmod +x setup_rust_android.sh
          ./setup_rust_android.sh
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build fdroid debug APK
        run: |
          set -o pipefail
          ./gradlew assembleFdroidDebug --stacktrace 2>&1 | tee build.log
      - name: Show build errors
        # Diagnosis only, runs last so the output sits at the end of the job log.
        if: failure()
        run: |
          set +e
          echo "=== BUILD DIAGNOSTICS START ==="
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          grep -E '^e: ' build.log | head -60 | cut -c1-400
          grep -E -B2 -A12 'error(\[|:)' build.log | grep -v -E '^[[:space:]]*at ' | head -80 | cut -c1-400
          grep -E -A6 'What went wrong' build.log | head -20 | cut -c1-300
          echo "=== BUILD DIAGNOSTICS END ==="
          exit 0
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: Amaze-fork-fdroid-debug
          path: app/build/outputs/apk/fdroid/debug/app-fdroid-debug.apk
          if-no-files-found: error
          retention-days: 14
