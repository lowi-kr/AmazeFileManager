name: Fork debug APK

# Builds the fdroid debug APK and attaches it to the run, so it can be
# downloaded and installed without a local Android toolchain.
# Runs on every push to a feature/** branch, or manually from the Actions tab.
on:
  push:
    branches:
      - 'feature/**'
  workflow_dispatch:

concurrency:
  group: fork-debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build fdroid debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 17
      - name: Set up NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          link-to-sdk: true
          local-cache: true
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Cache Rust dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            file_operations/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Setup Rust for Android
        run: |
          cd file_operations
          chmod +x setup_rust_android.sh
          ./setup_rust_android.sh
      - name: Probe cargo build
        # Runs cargo alone so its real error is readable. Only for diagnosis.
        continue-on-error: true
        working-directory: file_operations
        run: |
          set +e
          cargo build --target armv7-linux-androideabi > /tmp/cargo.log 2>&1
          code=$?
          shown=$(grep -v -E '^[[:space:]]*(Compiling|Downloaded|Downloading|Updating|Locking|Adding)' /tmp/cargo.log | tail -45 | cut -c1-250 | tr -d '\r')
          cfg=$(head -14 .cargo/config.toml | cut -c1-200)
          body=$(printf 'exit=%s rustc=%s\nndk dirs=%s\nANDROID_NDK_HOME=%s\n--- cargo ---\n%s\n--- config ---\n%s' "$code" "$(rustc --version)" "$(ls "$ANDROID_HOME/ndk" | tr '\n' ' ')" "$ANDROID_NDK_HOME" "$shown" "$cfg" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::warning title=Cargo probe::${body}"
          exit $code
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build fdroid debug APK
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -o pipefail
          ./gradlew assembleFdroidDebug --stacktrace 2>&1 | tee build.log
      - name: Copy build errors into an annotation
        if: failure()
        run: |
          # Job logs need a GitHub login to read, annotations do not.
          kotlin_errors=$(grep -E '^e: ' build.log | head -40 | cut -c1-300 | tr -d '\r')
          wrong=$(grep -E -A4 'What went wrong' build.log | head -12 | cut -c1-300 | tr -d '\r')
          body=$(printf '%s\n--- gradle ---\n%s' "$kotlin_errors" "$wrong" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Build diagnostics::${body}"
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: Amaze-fork-fdroid-debug
          path: app/build/outputs/apk/fdroid/debug/app-fdroid-debug.apk
          if-no-files-found: error
          retention-days: 14
