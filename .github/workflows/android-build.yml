name: Android Build CI

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check_spotless:
    name: Check spotless
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 17
      - name: Set up NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          link-to-sdk: true
          local-cache: true
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Cache Rust dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            file_operations/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Setup Rust for Android
        run: |
          cd file_operations
          chmod +x setup_rust_android.sh
          ./setup_rust_android.sh
      - name: Verify Rust setup
        run: |
          cd file_operations
          echo "🔍 Verifying Rust Android targets..."
          rustup target list --installed | grep android || echo "No Android targets found"
          echo "🔍 Verifying cargo configuration..."
          if [ -f .cargo/config.toml ]; then
            echo "✅ .cargo/config.toml exists"
          else
            echo "❌ .cargo/config.toml missing"
            exit 1
          fi
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Check formatting using spotless
        run: ./gradlew spotlessCheck --stacktrace

  build:
    name: Build debug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 17
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Cache Rust dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            file_operations/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Setup Rust for Android
        run: |
          cd file_operations
          chmod +x setup_rust_android.sh
          ./setup_rust_android.sh
      - name: Verify Rust setup
        run: |
          cd file_operations
          echo "🔍 Verifying Rust Android targets..."
          rustup target list --installed | grep android || echo "No Android targets found"
          echo "🔍 Verifying cargo configuration..."
          if [ -f .cargo/config.toml ]; then
            echo "✅ .cargo/config.toml exists"
          else
            echo "❌ .cargo/config.toml missing"
            exit 1
          fi
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build with Gradle
        run: ./gradlew assembledebug --stacktrace

  build_signed_release:
    name: Build signed release APK (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          link-to-sdk: true
          local-cache: true
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            file_operations/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Set up Rust for Android
        run: |
          cd file_operations
          chmod +x setup_rust_android.sh
          ./setup_rust_android.sh
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Required repository secret $name is missing or empty."
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.keystore
          cat > signing.properties <<EOF
          STORE_FILE=$GITHUB_WORKSPACE/release.keystore
          STORE_PASSWORD=$STORE_PASSWORD
          KEY_ALIAS=$KEY_ALIAS
          KEY_PASSWORD=$KEY_PASSWORD
          EOF
      - name: Build F-Droid release APK
        run: ./gradlew assembleFdroidRelease --stacktrace
      - name: Verify APK exists
        run: |
          test -s app/build/outputs/apk/fdroid/release/app-fdroid-release.apk
          file app/build/outputs/apk/fdroid/release/app-fdroid-release.apk
      - name: Upload release APK
        uses: actions/upload-artifact@v6
        with:
          name: Amaze-fdroid-release
          path: app/build/outputs/apk/fdroid/release/app-fdroid-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Remove signing material
        if: always()
        run: rm -f release.keystore signing.properties