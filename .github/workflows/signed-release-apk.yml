name: Signed Release APK

on:
  push:
    branches:
      - 'feature/embed-utilities'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signed-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build signed F-Droid release APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install the exact Android NDK required by Gradle
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "ndk;28.2.13676358"
          NDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}/ndk/28.2.13676358"
          test -x "$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          test -x "$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi21-clang"
          echo "Verified NDK compiler: $NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            file_operations/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Set up Rust for Android
        run: |
          cd file_operations
          chmod +x setup_rust_android.sh
          ./setup_rust_android.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Required repository secret $name is missing or empty."
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.keystore
          cat > signing.properties <<EOF
          STORE_FILE=$GITHUB_WORKSPACE/release.keystore
          STORE_PASSWORD=$STORE_PASSWORD
          KEY_ALIAS=$KEY_ALIAS
          KEY_PASSWORD=$KEY_PASSWORD
          EOF

      - name: Build non-debug signed release APK
        run: ./gradlew assembleFdroidRelease --stacktrace

      - name: Verify APK exists
        run: |
          test -s app/build/outputs/apk/fdroid/release/app-fdroid-release.apk
          file app/build/outputs/apk/fdroid/release/app-fdroid-release.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v6
        with:
          name: Amaze-fdroid-release
          path: app/build/outputs/apk/fdroid/release/app-fdroid-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Remove signing material
        if: always()
        run: rm -f release.keystore signing.properties